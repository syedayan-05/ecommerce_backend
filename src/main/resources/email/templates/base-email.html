<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sufi Leather</title>
</head>

<body style="
    margin: 0;
    padding: 0;
    background-color: #f3f0eb;
    font-family: Arial, Helvetica, sans-serif;
    color: #29231d;
    -webkit-font-smoothing: antialiased;
">

<table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #f3f0eb; padding: 40px 12px;">
    <tr>
        <td align="center">

            <!-- MAIN CONTAINER -->
            <table width="600" cellpadding="0" cellspacing="0" border="0" style="
                max-width: 600px;
                width: 100%;
                background-color: #ffffff;
                border-radius: 12px;
                overflow: hidden;
                border: 1px solid #e5dfd5;
            ">

                <!-- HEADER -->
                <tr>
                    <td align="center" style="
                        background-color: #2f1d0b;
                        padding: 32px 20px;
                        border-bottom: 3px solid #c49a55;
                    ">
                        <img src="cid:sufiLogo" alt="Sufi Leather" width="180" style="
                            display: block;
                            width: 180px;
                            max-width: 80%;
                            height: auto;
                            border: 0;
                        ">
                    </td>
                </tr>

                <!-- CONTENT AREA -->
                <tr>
                    <td style="padding: 40px 36px 32px;">

                        <!-- TITLE -->
                        <h1 style="
                            margin: 0 0 20px;
                            color: #2f1d0b;
                            font-size: 25px;
                            line-height: 1.3;
                            font-weight: 700;
                        ">
                            {{TITLE}}
                        </h1>

                        <!-- CONTENT -->
                        <div style="
                            margin: 0 0 22px;
                            font-size: 15px;
                            line-height: 1.7;
                            color: #4a433a;
                        ">
                            {{CONTENT}}
                        </div>

                        <!-- ACTION BUTTON / PLACEHOLDER -->
                        <div style="margin: 28px 0;">
                            {{ACTION}}
                        </div>

                    </td>
                </tr>

                <!-- NOTICE / FOOTER BANNER -->
                <tr>
                    <td style="
                        padding: 0 36px 32px;
                    ">
                        <table width="100%" cellpadding="0" cellspacing="0" border="0" style="
                            background-color: #faf8f5;
                            border-radius: 8px;
                            border-left: 3px solid #c49a55;
                        ">
                            <tr>
                                <td style="padding: 14px 18px;">
                                    <p style="
                                        margin: 0;
                                        font-size: 13px;
                                        line-height: 1.5;
                                        color: #77716a;
                                    ">
                                        If you did not expect this email, you can safely ignore it.
                                    </p>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <!-- FOOTER -->
                <tr>
                    <td align="center" style="
                        background-color: #2f1d0b;
                        padding: 28px 20px;
                    ">

                        <div style="
                            color: #d9b77b;
                            font-size: 14px;
                            font-weight: bold;
                            letter-spacing: 2.5px;
                        ">
                            SUFI LEATHER
                        </div>

                        <div style="
                            margin-top: 6px;
                            color: #c8b9a4;
                            font-size: 10px;
                            letter-spacing: 3.5px;
                        ">
                            HAND CRAFTED
                        </div>

                        <div style="
                            margin-top: 18px;
                            color: #8f8274;
                            font-size: 11px;
                        ">
                            © 2026 Sufi Leather. All rights reserved.
                        </div>

                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
