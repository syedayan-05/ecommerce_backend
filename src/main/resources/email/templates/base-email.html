<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sufi Leather</title>
</head>

<body style="
    margin:0;
    padding:0;
    background:#f3f0eb;
    font-family:Arial, Helvetica, sans-serif;
    color:#29231d;
">

<table width="100%" cellpadding="0" cellspacing="0" border="0"
       style="background:#f3f0eb; padding:35px 15px;">

    <tr>
        <td align="center">

            <!-- MAIN CONTAINER -->
            <table width="600" cellpadding="0" cellspacing="0" border="0"
                   style="
                       max-width:600px;
                       width:100%;
                       background:#ffffff;
                       border-radius:14px;
                       overflow:hidden;
                   ">

                <!-- HEADER -->
                <tr>
                    <td align="center"
                        style="
                            background:#2f1d0b;
                            padding:28px 20px;
                        ">

                        <img
                                src="cid:sufiLogo"
                                alt="Sufi Leather"
                                width="190"
                                style="
                                display:block;
                                width:190px;
                                max-width:80%;
                                height:auto;
                            "
                        >

                    </td>
                </tr>


                <!-- GOLD LINE -->
                <tr>
                    <td style="
                        height:4px;
                        background:#c49a55;
                        font-size:0;
                        line-height:0;
                    ">
                    </td>
                </tr>


                <!-- CONTENT -->
                <tr>
                    <td style="
                        padding:42px 42px 35px;
                    ">

                        <h1 style="
                            margin:0 0 20px;
                            color:#2f1d0b;
                            font-size:27px;
                            line-height:1.3;
                            font-weight:600;
                        ">
                            {{TITLE}}
                        </h1>


                        <p style="
                            margin:0 0 18px;
                            font-size:16px;
                            line-height:1.7;
                            color:#514a42;
                        ">
                            {{CONTENT}}
                        </p>


                        {{ACTION}}


                        <p style="
                            margin:30px 0 0;
                            font-size:14px;
                            line-height:1.6;
                            color:#77716a;
                        ">
                            If you did not expect this email, you can safely
                            ignore it.
                        </p>

                    </td>
                </tr>


                <!-- FOOTER -->
                <tr>
                    <td align="center"
                        style="
                            background:#2f1d0b;
                            padding:25px 20px;
                        ">

                        <div style="
                            color:#d9b77b;
                            font-size:15px;
                            font-weight:bold;
                            letter-spacing:2px;
                        ">
                            SUFI LEATHER
                        </div>

                        <div style="
                            margin-top:8px;
                            color:#c8b9a4;
                            font-size:11px;
                            letter-spacing:3px;
                        ">
                            HAND CRAFTED
                        </div>

                        <div style="
                            margin-top:18px;
                            color:#8f8274;
                            font-size:11px;
                        ">
                            © 2026 Sufi Leather. All rights reserved.
                        </div>

                    </td>
                </tr>

            </table>

        </td>
    </tr>

</table>

</body>
</html>
